<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robby map</title>
    <link rel="stylesheet" href="/src/viewer.css" />
  </head>
  <body>
    <header id="chrome">
      <button type="button" id="zoom-out" title="Zoom out" disabled>← out</button>
      <fieldset id="org-toggle" aria-label="Organization">
        <button type="button" id="org-structure" class="org-btn is-active" data-org="structure">
          Structure
        </button>
        <button type="button" id="org-entrypoints" class="org-btn" data-org="entrypoints">
          Entrypoints
        </button>
        <button type="button" id="org-runs" class="org-btn" data-org="runs" title="Runs / Reviews">
          Runs
        </button>
      </fieldset>
      <div id="crumb"></div>
      <div id="hint">click a card to zoom · portals jump to related views</div>
    </header>
    <main id="viewport">
      <div id="world"></div>
    </main>
    <aside id="runs-dock" hidden aria-label="Runs and reviews">
      <div class="runs-dock-header">
        <strong>Runs / Reviews</strong>
        <div class="runs-dock-filters" role="group" aria-label="Filter">
          <button type="button" class="runs-filter is-active" data-filter="reviews">Reviews</button>
          <button type="button" class="runs-filter" data-filter="all">All</button>
        </div>
        <button type="button" id="runs-dock-close" title="Close">×</button>
      </div>
      <div id="runs-dock-body">
        <section class="runs-section">
          <h3>Pending</h3>
          <ul id="runs-pending" class="runs-list"></ul>
        </section>
        <section class="runs-section">
          <h3>Active</h3>
          <ul id="runs-active" class="runs-list"></ul>
        </section>
        <section class="runs-section">
          <h3>Recent</h3>
          <ul id="runs-recent" class="runs-list"></ul>
        </section>
      </div>
    </aside>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
