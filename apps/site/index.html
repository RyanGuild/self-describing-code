<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robby map</title>
    <link rel="stylesheet" href="/src/viewer.css" />
  </head>
  <body>
    <header id="chrome">
      <button type="button" id="zoom-out" title="Zoom out" disabled>← out</button>
      <fieldset id="org-toggle" aria-label="Organization">
        <button type="button" id="org-structure" class="org-btn is-active" data-org="structure">
          Structure
        </button>
        <button type="button" id="org-entrypoints" class="org-btn" data-org="entrypoints">
          Entrypoints
        </button>
        <button type="button" id="org-runs" class="org-btn" data-org="runs" title="Runs / Reviews">
          Runs
        </button>
        <button
          type="button"
          id="org-metrics"
          class="org-btn"
          data-org="metrics"
          title="Improvement metrics"
        >
          Metrics
        </button>
      </fieldset>
      <div id="crumb"></div>
      <div id="hint">click a card to zoom · portals jump to related views</div>
      <div id="watch-badge" hidden aria-live="polite"></div>
    </header>
    <main id="viewport">
      <div id="world"></div>
      <aside id="runs-panel" hidden aria-label="Pipeline runs">
        <div class="runs-panel-header">
          <div class="runs-dock-filters">
            <button type="button" class="runs-filter" data-filter="all">All</button>
            <button type="button" class="runs-filter" data-filter="live">Live</button>
            <button type="button" class="runs-filter" data-filter="cursor">cursor.*</button>
            <button type="button" class="runs-filter is-active" data-filter="reviews">
              Reviews
            </button>
          </div>
        </div>
        <div class="runs-panel-body">
          <ul id="runs-list"></ul>
          <div id="runs-detail" hidden></div>
        </div>
      </aside>
      <aside id="metrics-panel" hidden aria-label="Improvement metrics">
        <div class="metrics-panel-header">
          <fieldset class="metrics-sort" aria-label="Sort metrics">
            <button type="button" class="metrics-sort-btn is-active" data-sort="type">
              By type
            </button>
            <button type="button" class="metrics-sort-btn" data-sort="path">By filesystem</button>
          </fieldset>
          <div id="metrics-summary" class="metrics-summary"></div>
        </div>
        <div class="metrics-panel-body">
          <div class="metrics-table-wrap">
            <table id="metrics-table">
              <thead>
                <tr>
                  <th scope="col">Metric</th>
                  <th scope="col">Type</th>
                  <th scope="col">Score</th>
                  <th scope="col">Subject / module</th>
                  <th scope="col">Path</th>
                  <th scope="col">Source</th>
                </tr>
              </thead>
              <tbody id="metrics-tbody"></tbody>
            </table>
          </div>
          <div id="metrics-detail" hidden aria-live="polite"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
