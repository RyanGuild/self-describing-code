name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # robby_render/index.md is already over the 1000-line page budget on main.
        # build.rs regenerates .robby/ and docs/self-model/ locally; they are gitignored.
        run: cargo test --workspace -- --skip no_page_is_a_wall_of_text
      - name: no tracked generated artifacts
        run: |
          tracked="$(git ls-files .robby docs/self-model apps/site/public/scene.json apps/site/public/scene-entrypoints.json apps/site/public/frames)"
          if [ -n "$tracked" ]; then
            echo "generated paths must not be tracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          git diff --exit-code

  site:
    name: site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run check
