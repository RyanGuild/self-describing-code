[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/robby/robby"

[workspace.dependencies]
robby-ir = { path = "crates/robby-ir" }
robby-render = { path = "crates/robby-render" }
robby-extract = { path = "crates/robby-extract" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syn = { version = "3", features = ["full", "visit", "extra-traits", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
rayon = "1"

[profile.release]
lto = "thin"
